<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lovehub - Shared life planning.">
  <!-- Google profile photos 403 when the page sends a Referer. -->

  <meta name="google-signin-client_id" content="172938928038-svhd6f7hc6jknkbtbqv08ksec8t5ho40.apps.googleusercontent.com">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  // This helps with cross-origin redirect results
  window.flutterWebRenderer = "html";
</script>
  <title>Lovehub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #F5F7FA; /* Your app's off-white background */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      border: 5px solid #FFE4E1; /* Very light pink track */
      border-top: 5px solid #E91E63; /* Lovehub Pink */
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .loading-text {
      color: #E91E63;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading Lovehub...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
